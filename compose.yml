services:
  postgres:
    image: postgres:18
    container_name: postgres-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: prospect-ai

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d prospect-ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: prospect-ai-api
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn api.main:app --host 0.0.0.0 --port 8000"
  
  redis:
    image: redis
    container_name: redis
    ports:
    - "6379:6379"

volumes:
  postgres-data:

