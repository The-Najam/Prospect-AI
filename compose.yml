services:
  postgres:
    image: postgres:18
    container_name: postgres-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD:  ${DB_PASSWORD}
      POSTGRES_DB: prospect-ai

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql
  
  redis:
    image: redis
    container_name: redis
    ports:
    - "6379:6379"

volumes:
  postgres-data:






