services:
  postgres:
    image: postgres:18
    container_name: postgres-db

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD:  ${DB_PASSWORD}
      POSTGRES_DB: prospect-ai

    ports:
      - "543do2:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
